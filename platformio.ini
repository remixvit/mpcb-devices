; mpcb-devices monorepo
; Сборка конкретной платы: pio run -e c6-wifi
; Прошивка:                pio run -e c6-wifi --target upload
; Все платы:               pio run

[platformio]
default_envs = c6-wifi
src_dir      = .        ; каждый env сам выбирает папку через build_src_filter

; ── Общая база ────────────────────────────────────────────────────────────────
[base]
framework  = arduino
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
lib_extra_dirs = lib    ; lib/mpcb-iot-core подхватывается автоматически
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os

; ── ESP32-C6 · WiFi 6 + BLE · Ворота цех ─────────────────────────────────────
[env:c6-wifi]
extends                  = base
board                    = esp32-c6-devkitc-1
board_build.partitions   = c6-wifi/partitions_4mb_ota.csv
build_src_filter         = -<*> +<c6-wifi/src/>
build_flags              =
    ${base.build_flags}
    -DMPCB_USE_BLE=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DNIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.0.0
    adafruit/DHT sensor library @ ^1.4.0
    milesburton/DallasTemperature @ ^3.9.0
    https://github.com/paulstoffregen/OneWire
    https://github.com/pololu/vl53l0x-arduino
    https://github.com/pololu/vl53l1x-arduino
    robtillaart/PCF8574 @ ^0.3.2

; ── ESP32-C3 · WiFi + BLE + Deep Sleep ───────────────────────────────────────
[env:c3]
extends                  = base
board                    = esp32-c3-devkitm-1
board_build.partitions   = c3/partitions_4mb_ota.csv
build_src_filter         = -<*> +<c3/src/>
build_flags              =
    ${base.build_flags}
    -DCONFIG_PM_ENABLE=0
    -DI2C_SDA=4
    -DI2C_SCL=5
    -DMPCB_USE_BLE=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DNIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.0.0
    adafruit/DHT sensor library @ ^1.4.0
    milesburton/DallasTemperature @ ^3.9.0
    https://github.com/paulstoffregen/OneWire
    https://github.com/pololu/vl53l0x-arduino
    https://github.com/pololu/vl53l1x-arduino
    robtillaart/PCF8574 @ ^0.3.2

; ── ESP32-C6 · Zigbee end device ─────────────────────────────────────────────
[env:c6-zigbee]
extends                = base
board                  = esp32-c6-devkitc-1
board_build.partitions = c6-zigbee/partitions_8mb_zb.csv
build_src_filter       = -<*> +<c6-zigbee/src/>
build_flags            =
    ${base.build_flags}
    -DZIGBEE_MODE_ED

; ── ESP32-H2 · Zigbee + BLE · батарейный узел ────────────────────────────────
[env:h2]
extends          = base
board            = esp32h2devkitm-1
build_src_filter = -<*> +<h2/src/>
build_flags =
    ${base.build_flags}
    -DMPCB_USE_BLE=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DNIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino @ ^2.0.0

; ── LilyGO TTGO T4 v1.1 · ESP32 · Display + HX711 ───────────────────────────
[env:t4]
extends                  = base
board                    = esp32dev
board_build.partitions   = t4/partitions_4mb_ota.csv
build_src_filter         = -<*> +<t4/src/>
build_flags =
    -Os
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=12
    -DTFT_CS=27
    -DTFT_DC=26
    -DTFT_RST=5
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
lib_deps =
    ${base.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
    bogde/HX711 @ ^0.7.5
    https://github.com/mathertel/OneButton

; ── ESP32-S3-Zero · WiFi · опциональный дисплей ILI9341 ──────────────────────
; Дисплей: передать -DMPCB_USE_DISPLAY=1 + lib_deps=lovyan03/LovyanGFX через build-agent
[env:s3]
extends                  = base
board                    = esp32-s3-devkitc-1
board_build.partitions   = s3/partitions_4mb_ota.csv
board_upload.flash_size  = 4MB
build_src_filter         = -<*> +<s3/src/>
lib_ignore               = Zigbee
build_flags              =
    ${base.build_flags}
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${base.lib_deps}
    adafruit/DHT sensor library @ ^1.4.0
    milesburton/DallasTemperature @ ^3.9.0
    https://github.com/paulstoffregen/OneWire
    https://github.com/pololu/vl53l0x-arduino
    robtillaart/PCF8574 @ ^0.3.2
